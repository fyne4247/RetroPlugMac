name: build

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The dpf.js submodule (and its nested submodules) use SSH URLs; the
          # runner has no SSH key. Init them ourselves after rewriting to HTTPS.
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends \
            cmake ninja-build pkg-config \
            libgl-dev libglu1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev libxinerama-dev \
            libdbus-1-dev libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libffi-dev libssl-dev \
            libsdl2-dev \
            xvfb

      - name: Install RGBDS (boot-ROM assembler)
        run: |
          set -eux
          tmp="$(mktemp -d)"; cd "$tmp"
          curl -fsSL "https://github.com/gbdev/rgbds/releases/download/v1.0.1/rgbds-linux-x86_64.tar.xz" -o rgbds.tar.xz
          tar -xJf rgbds.tar.xz
          sudo install -m 0755 rgbasm rgblink rgbgfx rgbfix /usr/local/bin/
          rgbasm --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        run: |
          pnpm install --frozen-lockfile
          # The UI bundle's react/react-reconciler/lvgljs-ui live in
          # lv_binding_js's own workspace (deps/ is excluded from the root
          # workspace), so it needs its own install (see AGENTS.md).
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      - name: Build
        run: ./build.sh

      - name: TS tests
        run: pnpm test

      - name: Install plugin-format validators
        run: |
          set -eux
          tmp="$(mktemp -d)"
          cd "$tmp"
          curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip" -o pv.zip
          unzip -q pv.zip
          sudo install -m 0755 pluginval /usr/local/bin/pluginval
          curl -fsSL "https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-ubuntu-18.04.tar.gz" -o cv.tgz
          tar -xzf cv.tgz
          sudo install -m 0755 clap-validator /usr/local/bin/clap-validator
          pluginval --version
          clap-validator --version

      - name: Validate plugins
        run: xvfb-run -a pnpm validate

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retroplug-linux-x86_64
          if-no-files-found: warn
          path: |
            build/bin/retroplug
            build/bin/retroplug-cli
            build/bin/retroplug.clap
            build/bin/retroplug.vst3
            build/bin/retroplug-vst2.so

  windows:
    runs-on: windows-2022
    # Non-blocking: the CI plumbing here is correct (submodules, RGBDS, vcpkg
    # sdl2+libffi, build.bat all run), but the reworked tree has a pre-existing
    # Windows build break — DPF's DGL/NanoVG fails to compile under MSVC (GL2+
    # symbols undeclared), and spec/07-migration.md lists 4 unported Windows
    # link fixes on top. Drop continue-on-error once the Windows build compiles.
    continue-on-error: true
    env:
      # build.bat defaults VCPKG_ROOT to C:\code\vcpkg; point it at the runner's
      # preinstalled vcpkg. RGBDS_DIR is set later once RGBDS is extracted.
      VCPKG_ROOT: C:\vcpkg
      # TEMP (ci-win-nanovg): trip build.bat's :rpdiag probe (compile+preprocess).
      RP_DIAG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      - name: Install RGBDS (boot-ROM assembler)
        shell: pwsh
        run: |
          $ver = "v1.0.1"
          Invoke-WebRequest "https://github.com/gbdev/rgbds/releases/download/$ver/rgbds-win64.zip" -OutFile rgbds.zip
          Expand-Archive rgbds.zip -DestinationPath "$env:RUNNER_TEMP\rgbds"
          # build.bat prepends %RGBDS_DIR% to PATH so find_program locates rgbasm/rgblink/rgbgfx.
          "RGBDS_DIR=$env:RUNNER_TEMP\rgbds" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-static-sdl2-libffi-${{ runner.os }}

      - name: Install vcpkg dependencies (x64-windows-static)
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install sdl2:x64-windows-static libffi:x64-windows-static

      - name: Pre-fetch Khronos GL headers (khronos.org errors for CI runner IPs)
        shell: pwsh
        run: |
          # DPF's DGL downloads GL/glext.h from www.khronos.org at configure time,
          # but that host returns an error/redirect to GitHub Actions runner IPs.
          # CMake's file(DOWNLOAD) has no status check, so it writes that garbage as
          # glext.h — the file exists (no C1083) but has no PFNGL* typedefs, and
          # NanoVG.cpp fails with a wall of C4430/C2065. Seed the real headers from
          # GitHub raw (reachable from runners) so DPF's `if(NOT EXISTS)` skips its
          # broken download. Fail loudly if the fetch is bad.
          $k = "deps/dpf.js/deps/dpf/khronos"
          New-Item -ItemType Directory -Force "$k/GL","$k/KHR" | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/KhronosGroup/OpenGL-Registry/main/api/GL/glext.h" -OutFile "$k/GL/glext.h"
          Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/main/api/KHR/khrplatform.h" -OutFile "$k/KHR/khrplatform.h"
          $len = (Get-Item "$k/GL/glext.h").Length
          if ($len -lt 100000) { throw "glext.h too small ($len bytes) — bad download" }
          if (-not (Select-String -Path "$k/GL/glext.h" -Pattern "PFNGLACTIVETEXTUREPROC" -Quiet)) { throw "glext.h missing PFNGL typedefs" }
          Write-Host "seeded glext.h ($len bytes) + khrplatform.h"

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retroplug-windows-x86_64
          if-no-files-found: warn
          path: |
            build/bin/retroplug.exe
            build/bin/retroplug-cli.exe
            build/bin/retroplug.clap
            build/bin/retroplug.vst3
            build/bin/retroplug-vst2.dll

  # Native arm64 build check (proven green). Universal + codesign/notarization
  # and the AU target are future work.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install build dependencies (Homebrew)
        run: |
          brew install ninja pkg-config sdl2 libffi rgbds
          # Homebrew's keg-only libffi needs its pkg-config on the path.
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      - name: Build
        run: ./build.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retroplug-macos-arm64
          if-no-files-found: warn
          path: |
            build/bin/retroplug
            build/bin/retroplug-cli
            build/bin/retroplug.clap
            build/bin/retroplug.vst3
            build/bin/retroplug.component
            build/bin/retroplug-vst2.dylib
